{% extends "layout.html" %}
{% block title %}Log In &mdash; Repertoire Studio{% endblock %}

{% block content %}
<div class="hero-section" style="max-width: 440px;">
    <h2>Studio Sign In</h2>
    <form method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" class="form-control" value="{{ config['SEED_USERNAME'] }}" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control" value="{{ config['SEED_PASSWORD'] }}" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Log In</button>
    </form>
    <p style="margin-top: 1rem; font-size: 0.88rem;">
        New to Repertoire Studio? <a href="{{ url_for('register') }}">Create an account</a>.
    </p>
</div>
{% endblock %}
