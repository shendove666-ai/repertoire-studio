{% extends "layout.html" %}
{% block title %}Register &mdash; Repertoire Studio{% endblock %}

{% block content %}
<div class="hero-section" style="max-width: 440px;">
    <h2>Create Studio Account</h2>
    <form method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" class="form-control" minlength="3" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control" minlength="4" required>
        </div>
        <div class="form-group">
            <label for="confirmation">Confirm Password</label>
            <input type="password" name="confirmation" id="confirmation" class="form-control" minlength="4" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Register</button>
    </form>
</div>
{% endblock %}
