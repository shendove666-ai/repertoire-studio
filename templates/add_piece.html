{% extends "layout.html" %}
{% block title %}Add Repertoire Work &mdash; Repertoire Studio{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Add Repertoire Work</h1>
        <p>Catalog a new composition with structural form and technical focus metadata.</p>
    </div>
</div>

<div class="panel-card" style="max-width: 680px;">
    <form method="post">
        <div class="form-row">
            <div class="form-group">
                <label for="title">Work Title</label>
                <input type="text" name="title" id="title" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="composer">Composer</label>
                <input type="text" name="composer" id="composer" class="form-control" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="opus_catalog">Opus / Catalog Number</label>
                <input type="text" name="opus_catalog" id="opus_catalog" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="musical_key">Primary Key</label>
                <input type="text" name="musical_key" id="musical_key" class="form-control" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="musical_form">Musical Form</label>
                <input type="text" name="musical_form" id="musical_form" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="difficulty">Technical Difficulty (1-5)</label>
                <select name="difficulty" id="difficulty" class="form-control">
                    <option value="1">1 &mdash; Elementary</option>
                    <option value="2">2 &mdash; Intermediate</option>
                    <option value="3" selected>3 &mdash; Advanced Intermediate</option>
                    <option value="4">4 &mdash; Conservatory Standard</option>
                    <option value="5">5 &mdash; Virtuoso Concert Repertoire</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label for="technical_focus">Primary Technical Challenge</label>
            <input type="text" name="technical_focus" id="technical_focus" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="mastery_status">Initial Mastery Stage</label>
            <select name="mastery_status" id="mastery_status" class="form-control">
                <option value="In Progress">In Progress</option>
                <option value="Polishing">Polishing</option>
                <option value="Performance Ready">Performance Ready</option>
            </select>
        </div>
        <div class="form-group">
            <label for="notes">Interpretive &amp; Structural Notes</label>
            <textarea name="notes" id="notes" rows="3" class="form-control"></textarea>
        </div>
        <div style="display: flex; gap: 0.8rem;">
            <button type="submit" class="btn">Save to Catalog</button>
            <a href="{{ url_for('repertoire') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
